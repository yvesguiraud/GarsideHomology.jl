# Homology of the Artin groups of spherical type, the braid groups of the finite Coxeter
# groups W: with trivial coefficients (`trivial`) and with coefficients in the sign
# representation ℤε, where the braid reflections act by −1 (`sign`), H₀ to Hₙ for W of
# rank n; numbers of cells of the minimal resolution of the dual braid monoid
# (`cells_minimal`).
#
# Provenance: computed in J1 by GarsideHomology ([[provenance]]), from the classical braid monoid
# B⁺(W) and from the dual braid monoid B*(W) wherever both were computed, with equal
# results; ℤε of B*(A₉) and of B*(E₈) not computed, their `sign` coming from B⁺(W); I2(p)
# from B*(W) only. `cells_minimal`: the numbers of cells of the resolution Gauss_a of
# B*(W) in degrees 0 to n, which is minimal (ranks of the Tor groups, independent of the
# numbering of the atoms); absent where B*(W) was not computed (A10 to A12, B9, B10, D9,
# D10). The minimal resolution of B⁺(W) has binomial(n, k) cells in degree k and is not
# recorded. The tables H3, F4, H4, E6, E7 and E8 agree with G23, G28, G30, G35, G36 and
# G37 of exceptional_braid_groups.toml.
#
# One table per type: A1 to A12, B2 to B10, D4 to D10, E6 to E8, F4, H3, H4, then I2(p)
# for 5 ≤ p ≤ 30 (I2(3) and I2(4) are A2 and B2, and G₂ is written I2(6)). Groups are
# written in the form displayed by FinitelyGeneratedAbelianGroup.

