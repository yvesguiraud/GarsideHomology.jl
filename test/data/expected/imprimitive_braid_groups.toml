# Homology of the braid groups of imprimitive complex reflection groups G(m, p, n), with
# the modules of exceptional_braid_groups.toml (`trivial`, `sign`), and numbers of cells
# of the minimal resolution of the dual braid monoid (`cells_minimal`), in the range of
# J1.f: G(m, m, n) for 3 ≤ n ≤ 8 and 3 ≤ m ≤ 30 with at most 25 080 simples (as many as
# B*(E₈)) and at most 32 767 roots (G(29, 29, 7) excluded), and G(m, 1, n) for 2 ≤ n ≤ 8
# and 3 ≤ m ≤ 8.
#
# Provenance: computed in J1 by GarsideHomology ([[provenance]]), dual germ dual_germ(crg(m, p, n))
# for the Coxeter element by default. `cells_minimal`: the numbers of cells of the
# resolution Gauss_a in degrees 0 to n, which is minimal. "?" marks a degree not computed:
# in ℤε, the elimination exceeded Int128, the ceiling of these computations, for
# G(m, m, 7) with m ≥ 7, G(29, 29, 6) and G(m, m, 8). In ℤ, the values agree with theorem
# 6.4 of Callegaro–Marin (Homology computations for complex braid groups) on H₀ = H₁ = ℤ
# and H₂, and with the Poincaré polynomial they recall on the Betti numbers: 1 + t, or
# 1 + t + tⁿ⁻¹ + tⁿ when m and n are even.
#
# For G(m, 1, n), `dual_germ_isomorphic_to` names the type Bₙ whose dual germ is
# isomorphic to that of G(m, 1, n) (found by germ_isomorphism): the homology and the cells
# are those of that table of spherical_artin_groups.toml, and are not repeated here.
#
# One table per group, named "G(m,p,n)": the G(m, 1, n) by n then m, then the G(m, m, n)
# by n then m.

