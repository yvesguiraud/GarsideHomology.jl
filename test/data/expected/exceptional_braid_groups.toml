# Homology of the braid groups of the 34 exceptional complex reflection groups W: with
# trivial coefficients (`trivial`) and with coefficients in the sign representation ℤε,
# where the braid reflections act by −1 (`sign`), H₀ to Hₙ for W of rank n; sizes of the
# Dehornoy–Lafont complexes of five well-generated groups; numbers of cells of the minimal
# resolution of the dual braid monoid of the 26 well-generated groups.
#
# Provenance: tables 1, 3 and 4 of the article of [source] (section 3), transcribed from
# arXiv v2. Table 3 agrees with the values computed in J0 (homologie.jl, dual monoids,
# Gauss_a) and in J1 by Gauss, except for H₄ of G32. Each key holds the value expected by
# the tests; where it differs from the printed value, `errata` keeps the printed value,
# with the key and degree concerned, whether the author's erratum lists it (`listed`) and
# the reason. The key `cells_minimal` is computed ([[provenance]]): the numbers of cells
# of the resolution Gauss_a of the dual braid monoid in degrees 0 to n; this resolution is
# minimal, so that they are the ranks of the Tor groups and do not depend on the numbering
# of the atoms.
#
# One table per group, in the order of the rows of tables 3 and 4, named as the snapshots
# (G4, …, G37). Groups are read by parse(FinitelyGeneratedAbelianGroup, s) and written in
# the form it displays. `well_generated = false` marks the 8 groups without a dual braid
# monoid (Garside monoids given by a presentation in J4, Garside category of G31 in J7).
# `real` names the Coxeter type of a real group, a table of spherical_artin_groups.toml;
# `isodiscriminantal` names the representative of its isodiscriminantality class, a table
# of this file or of spherical_artin_groups.toml: the braid groups of a class are
# isomorphic by an isomorphism sending braid reflections to braid reflections, hence have
# the same homology for both modules.
#
# Table 1: `cells_mar17` (row [Mar17], Dehornoy–Lafont complex of Marin, reproduced by the
# variant Gauss_d of J0) and `cells_optimised` (row "Optimized", order of section 2.2),
# numbers of cells in degrees 0 to n; `two_cell_bounds`: the lower and upper bounds of
# section 3.4 for the number of 2-cells of a Dehornoy–Lafont complex.

[source]
reference = "O. Garnier, Generalization of the Dehornoy–Lafont order complex to categories. Application to exceptional braid groups"
journal = "Appl. Categ. Structures 32 (2024), no. 1, article 1"  # according to dblp, not checked
arxiv = "2302.10033v2"
tables = [1, 3, 4]
erratum = "https://ogarnier.github.io/pub/erratum.pdf"
erratum_version = "2026-08-25"  # date of the last update printed in the erratum (section 1)

[[provenance]]
run = "f2"
description = "Gauss_a for the 26 well-generated exceptional groups and the representatives of their isodiscriminantality classes, in the numbering of J0 and in that by default: cells, certificates, homology in ℤ and ℤε compared with tables 3 and 4 (ℤε of G37 from Magma, J1.e)"
script = "CatLab j1/f2_exceptional.jl"
data = ["CatLab j1/out/f2_homologie_N9.csv", "CatLab j1/out/f2_tailles_N9.csv"]
catlab = "e81b959"
date = 2026-10-24
machine = "N9"
threads = 16
julia = "1.13.2"
gauss = "65e950d"
solver = "SparseElementaryDivisors 0.1.0"
chevie = "0.1.15"
numbering = ["j0", "default"]
value_types = ["Int64", "Int128"]

